name: MIP Agent Pipeline

on:
  workflow_dispatch:
    inputs:
      skip_retrain:
        description: 'Skip retraining (research + extract only)'
        required: false
        default: 'false'

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  PYTHON_VERSION: '3.12'

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - run: uv run playwright install chromium --with-deps
      - name: Run agent pipeline
        run: uv run python -m src.agent.pipeline
      - name: Sync updated forecasts to Supabase
        if: inputs.skip_retrain != 'true'
        run: uv run python scripts/sync_to_supabase.py

  notify:
    runs-on: ubuntu-latest
    needs: [agent]
    if: always()
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - name: Report status
        run: |
          echo "## Agent Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Agent | ${{ needs.agent.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Triggered: ${{ github.event_name }} at $(date -u)" >> $GITHUB_STEP_SUMMARY
      - name: Send alerts (email + Teams)
        if: always()
        run: |
          python -c "
          from src.utils.email_alert import notify_all
          status = 'failure' if '${{ needs.agent.result }}' == 'failure' else 'success'
          notify_all(
              'Agent Pipeline',
              status=status,
              details={
                  'Agent': '${{ needs.agent.result }}',
                  'Trigger': '${{ github.event_name }}',
                  'Skip retrain': '${{ inputs.skip_retrain }}',
              },
              run_url='https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}',
          )
          "
      - name: Fail if agent failed
        if: needs.agent.result == 'failure'
        run: exit 1
